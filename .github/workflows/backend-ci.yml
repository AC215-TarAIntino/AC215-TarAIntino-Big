name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/quiz-vector/**'
      - 'src/screenplay-writer/**'
      - 'src/scene-decomposer/**'
      - 'src/video-generator/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/quiz-vector/**'
      - 'src/screenplay-writer/**'
      - 'src/scene-decomposer/**'
      - 'src/video-generator/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  format-and-lint:
    name: Format and Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting with black
        run: |
          black --check src/ tests/ --exclude '/(\.git|\.venv|build|dist|node_modules)/'

      - name: Lint code with ruff
        run: |
          ruff check src/ tests/

  test:
    name: Test Microservices
    runs-on: ubuntu-latest
    needs: format-and-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create necessary secrets directories
        run: |
          mkdir -p src/quiz-vector/secrets
          mkdir -p src/video-generator

      - name: Create mock credentials for quiz-vector
        run: |
          echo '{"type": "service_account"}' > src/quiz-vector/secrets/llm-service-account.json

      - name: Create mock .env for screenplay-writer
        run: |
          echo "OPENROUTER_API_KEY=test_key" > src/screenplay-writer/.env
          echo "OMDB_API_KEY=test_key" >> src/screenplay-writer/.env

      - name: Create mock .env for scene-decomposer
        run: |
          echo "OPENROUTER_API_KEY=test_key" > src/scene-decomposer/.env

      - name: Create mock secrets for video-generator
        run: |
          echo '{"project_api_key": "test_key"}' > src/video-generator/secret.json
          echo '{"type": "service_account"}' > src/video-generator/gcp-credentials.json

      - name: Create mock data files for quiz-service
        run: |
          pip install numpy
          mkdir -p src/quiz-vector/src/datapipeline/logs
          python3 << 'EOF'
          import numpy as np
          import json

          # Create mock prior mean (100-dimensional zero vector)
          prior_mean = np.zeros(100, dtype=np.float64)
          np.save("src/quiz-vector/src/datapipeline/logs/prior_mean.npy", prior_mean)

          # Create mock prior covariance (100x100 identity matrix)
          prior_cov = np.eye(100, dtype=np.float64)
          np.save("src/quiz-vector/src/datapipeline/logs/prior_cov.npy", prior_cov)

          # Create mock tag index JSON
          tag_index = {"tag_ids_sorted": list(range(100))}
          with open("src/quiz-vector/src/datapipeline/logs/movie_tag_relevance_cos__tag_index.json", "w") as f:
              json.dump(tag_index, f)

          print("Mock data files created successfully!")
          EOF

      - name: Build and start Docker services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          # Wait for services to be healthy
          sleep 30

      - name: Check service health
        run: |
          docker compose ps
          docker compose logs

      - name: Run quiz-vector tests
        run: |
          docker compose exec -T quiz-service python -m pytest tests/ --cov=. --cov-report=term-missing -v

      - name: Run screenplay-writer tests
        run: |
          docker compose exec -T screenplay-writer python -m pytest tests/ --cov=. --cov-report=term-missing -v

      - name: Run scene-decomposer tests
        run: |
          docker compose exec -T scene-decomposer python -m pytest tests/ --cov=. --cov-report=term-missing -v

      - name: Run video-generator tests
        run: |
          docker compose exec -T video-generator python -m pytest tests/ --cov=. --cov-report=term-missing -v

      - name: Tear down Docker services
        if: always()
        run: |
          docker compose down -v
