name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Linting and Code Quality
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Run ruff linter
        run: |
          ruff check src/ tests/

      - name: Check code formatting with black
        run: |
          black --check src/ tests/ --exclude '/(\.git|\.venv|build|dist|node_modules)/'

      - name: Create mock env files for docker-compose validation
        run: |
          echo "OPENROUTER_API_KEY=test_key" > src/screenplay-writer/.env
          echo "OMDB_API_KEY=test_key" >> src/screenplay-writer/.env
          echo "OPENROUTER_API_KEY=test_key" > src/scene-decomposer/.env

      - name: Validate docker-compose syntax
        run: |
          docker compose config

  # Frontend Tests
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

  # Backend Tests
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install numpy for mock data generation
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Create necessary directories
        run: |
          mkdir -p src/quiz-vector/secrets
          mkdir -p src/quiz-vector/src/datapipeline/logs
          mkdir -p src/video-generator

      - name: Create mock credentials
        run: |
          echo '{"type": "service_account"}' > src/quiz-vector/secrets/llm-service-account.json
          echo "OPENROUTER_API_KEY=test_key" > src/screenplay-writer/.env
          echo "OMDB_API_KEY=test_key" >> src/screenplay-writer/.env
          echo "OPENROUTER_API_KEY=test_key" > src/scene-decomposer/.env
          echo '{"project_api_key": "test_key"}' > src/video-generator/secrets.json
          echo '{"type": "service_account"}' > src/video-generator/gcp-credentials.json

      - name: Create mock data files for quiz-service
        run: |
          # Create mock numpy arrays for prior mean and covariance
          python3 -c "import numpy as np; np.save('src/quiz-vector/src/datapipeline/logs/prior_mean.npy', np.zeros(100))"
          python3 -c "import numpy as np; np.save('src/quiz-vector/src/datapipeline/logs/prior_cov.npy', np.eye(100))"
          # Create mock tag index JSON
          echo '{"tag_ids_sorted": [416, 284, 862, 1084, 496, 311, 347, 1023, 886, 267, 376, 18, 521, 229, 322, 688]}' > src/quiz-vector/src/datapipeline/logs/movie_tag_relevance_cos__tag_index.json

      - name: Build and start Docker services
        run: |
          export SKIP_CHROMA_INIT=true
          docker compose up -d --build
        env:
          SKIP_CHROMA_INIT: true

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          timeout=300  # 5 minutes timeout
          elapsed=0
          interval=5

          while [ $elapsed -lt $timeout ]; do
            # Check if all required services are running (not restarting)
            restarting=$(docker compose ps --format json | jq -r '.[] | select(.State == "restarting") | .Service' 2>/dev/null || echo "")

            if [ -z "$restarting" ]; then
              # Check health of services with healthchecks
              all_healthy=true
              for service in quiz-service screenplay-writer scene-decomposer video-generator; do
                health=$(docker inspect --format='{{.State.Health.Status}}' $service 2>/dev/null || echo "none")
                if [ "$health" != "healthy" ] && [ "$health" != "none" ]; then
                  all_healthy=false
                  echo "Service $service health: $health"
                fi
              done

              if $all_healthy; then
                echo "All services are healthy!"
                exit 0
              fi
            else
              echo "Services restarting: $restarting"
            fi

            sleep $interval
            elapsed=$((elapsed + interval))
            echo "Waited ${elapsed}s..."
          done

          echo "Timeout waiting for services to be healthy"
          docker compose ps
          docker compose logs
          exit 1

      - name: Check service health
        run: |
          docker compose ps
          echo "=== Service Logs ==="
          docker compose logs

      - name: Run all microservice tests
        run: |
          echo "=== Testing Quiz Service ==="
          docker compose exec -T quiz-service python -m pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing -v
          echo "=== Testing Screenplay Writer ==="
          docker compose exec -T screenplay-writer python -m pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing -v
          echo "=== Testing Scene Decomposer ==="
          docker compose exec -T scene-decomposer python -m pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing -v
          echo "=== Testing Video Generator ==="
          docker compose exec -T video-generator python -m pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Tear down services
        if: always()
        run: docker compose down -v

  # Detect which services changed (for future Docker builds)
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      quiz-vector: ${{ steps.filter.outputs.quiz-vector }}
      screenplay-writer: ${{ steps.filter.outputs.screenplay-writer }}
      scene-decomposer: ${{ steps.filter.outputs.scene-decomposer }}
      video-generator: ${{ steps.filter.outputs.video-generator }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            quiz-vector:
              - 'src/quiz-vector/**'
            screenplay-writer:
              - 'src/screenplay-writer/**'
            scene-decomposer:
              - 'src/scene-decomposer/**'
            video-generator:
              - 'src/video-generator/**'
            frontend:
              - 'src/frontend/**'

  # Status Check (all jobs must pass)
  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, frontend, test]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed!"

  # Deploy to GKE (only on main branch after all tests pass)
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [status-check, detect-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Build and Push Docker Images
        if: |
          needs.detect-changes.outputs.quiz-vector == 'true' ||
          needs.detect-changes.outputs.screenplay-writer == 'true' ||
          needs.detect-changes.outputs.scene-decomposer == 'true' ||
          needs.detect-changes.outputs.video-generator == 'true' ||
          needs.detect-changes.outputs.frontend == 'true'
        working-directory: src/deployment/deploy_images
        run: |
          echo "🔧 Installing Pulumi dependencies..."
          pip install -r requirements.txt

          echo "🔐 Logging into Pulumi..."
          pulumi login

          echo "📦 Selecting/creating stack..."
          pulumi stack select dev --create || pulumi stack select dev

          echo "⚙️  Configuring GCP project..."
          pulumi config set gcp_project ${{ secrets.GCP_PROJECT_ID }}
          pulumi config set gcp_region us-central1

          echo "🏗️  Building and pushing Docker images..."
          pulumi up --yes --skip-preview
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Deploy to Kubernetes
        working-directory: src/deployment/deploy_k8s
        run: |
          echo "🔧 Installing Pulumi dependencies..."
          pip install -r requirements.txt

          echo "🔐 Logging into Pulumi..."
          pulumi login

          echo "📦 Selecting/creating stack..."
          pulumi stack select dev --create || pulumi stack select dev

          echo "⚙️  Configuring GCP settings..."
          pulumi config set gcp_project ${{ secrets.GCP_PROJECT_ID }}
          pulumi config set gcp_region us-central1
          pulumi config set gcp_zone us-central1-a
          pulumi config set cluster_name taraintino-cluster
          pulumi config set node_count 3
          pulumi config set node_machine_type n1-standard-4

          echo "🚀 Deploying to Kubernetes..."
          pulumi up --yes --skip-preview
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Create API secrets in Kubernetes
        run: |
          echo "🔧 Installing gke-gcloud-auth-plugin..."
          gcloud components install gke-gcloud-auth-plugin --quiet

          echo "🔐 Getting cluster credentials..."
          gcloud container clusters get-credentials taraintino-cluster \
            --zone=us-central1-a \
            --project=${{ secrets.GCP_PROJECT_ID }}

          echo "🔑 Creating api-secrets..."
          kubectl create secret generic api-secrets \
            --from-literal=openrouter-api-key=${{ secrets.OPENROUTER_API_KEY }} \
            --from-literal=omdb-api-key=${{ secrets.OMDB_API_KEY }} \
            -n taraintino \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "✅ API secrets created successfully"

      - name: Get deployment info
        if: always()
        working-directory: src/deployment/deploy_k8s
        run: |
          echo "📦 Deployment Summary"
          echo "===================="
          pulumi login
          pulumi stack select dev
          echo ""
          echo "🌐 Application URL:"
          pulumi stack output app_url || echo "Not available"
          echo ""
          echo "🔧 Cluster Name:"
          pulumi stack output cluster_name || echo "Not available"
          echo ""
          echo "📊 All outputs:"
          pulumi stack output --json || echo "No outputs available"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
