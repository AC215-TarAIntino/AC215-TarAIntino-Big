version: "3.9"

services:
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      ALLOW_RESET: "true"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: src/datapipeline/Dockerfile
    image: rag-pipeline
    container_name: rag-app
    stdin_open: true
    tty: true
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-llm-service-account-474620}
      GOOGLE_APPLICATION_CREDENTIALS: /app/adc.json
      GCS_BUCKET: ${GCS_BUCKET:-tag-genome-data}
      GCS_PREFIX: ${GCS_PREFIX:-datasets/tag_genome}
      TAG_REL_OBJECT: ${TAG_REL_OBJECT:-datasets/tag_genome/tag_relevance.dat}

      # Talk to Chroma over HTTP
      CHROMA_SERVER_HOST: chroma
      CHROMA_SERVER_PORT: "8000"
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-movie_tag_relevance_cos}
      BATCH_SIZE: ${BATCH_SIZE:-2000}

      LOG_DIR: /app/logs
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/app/adc.json:ro
      - ./src/dataweb/tag-genome:/app/local-ds:ro
      - ./src/datapipeline/logs:/app/logs
    depends_on:
      - chroma

volumes:
  chroma_data:
