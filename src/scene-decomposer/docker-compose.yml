version: '3.8'

services:
  trailer-generator:
    build: .
    container_name: trailer-generator-api
    ports:
      - "8001:8001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - DEFAULT_TRAILER_DURATION=${DEFAULT_TRAILER_DURATION:-35}
      - INCLUDE_NARRATION=${INCLUDE_NARRATION:-true}
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
