[project]
name = "scene-decomposer"
version = "1.0.0"
description = "AI-powered trailer scene breakdown service using VEO 3.1 reference images system"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core API Framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    # OpenAI SDK (for OpenRouter compatibility)
    "openai==1.54.3",
    # Utilities
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.3",
    "httpx==0.27.2",
    "pytest-cov>=4.0.0",
    # Linting and formatting
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["--verbose", "--cov=src", "--cov-report=term-missing"]
