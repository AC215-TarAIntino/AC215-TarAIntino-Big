[project]
name = "quiz-vector"
version = "0.1.0"
description = "Quiz service and RAG system with Bayesian preference learning for the TarAIntino project"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "scipy==1.13.1",
  "matplotlib==3.8.0",
  "google-cloud-storage>=2.18.0,<3",
  "google-auth>=2.35.0",
  "tqdm==4.66.4",
  "chromadb>=0.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 50.0

