services:
  chroma:
    image: ghcr.io/chroma-core/chroma:0.6.1
    container_name: chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      ALLOW_RESET: "true"
    ports: ["8000:8000"]
    volumes: [chroma_data:/chroma]
    restart: unless-stopped

  # Build from quiz-vector root
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taraintino-base:latest
    container_name: rag-app
    stdin_open: true
    tty: true
    environment:

      # GCS auth
      GOOGLE_APPLICATION_CREDENTIALS: /app/adc.json

      # Chroma over HTTP
      CHROMA_SERVER_HOST: chroma
      CHROMA_SERVER_PORT: "8000"
      CHROMA_COLLECTION: movie_tag_relevance_cos

      LOG_DIR: /app/src/datapipeline/logs
    volumes:
      # mount service directory so edits reflect inside containers
      - ./secrets/llm-service-account.json:/app/adc.json:ro
      - .:/app
    depends_on: [chroma]

  quiz-service:
    image: taraintino-base:latest
    container_name: quiz-service
    command: uvicorn src.quiz_service.api:app --host 0.0.0.0 --port 8082
    environment:
      CHROMA_SERVER_HOST: chroma
      CHROMA_SERVER_PORT: "8000"
      CHROMA_COLLECTION: movie_tag_relevance_cos
      PRIOR_MEAN_PATH: /app/src/datapipeline/logs/prior_mean.npy
      PRIOR_COV_PATH: /app/src/datapipeline/logs/prior_cov.npy
      TAG_INDEX_JSON: /app/src/datapipeline/logs/movie_tag_relevance_cos__tag_index.json
    volumes:
      - .:/app
    ports: ["8082:8082"]
    depends_on: [chroma, app]

volumes:
  chroma_data: 