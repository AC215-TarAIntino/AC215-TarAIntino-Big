[project]
name = "video-generator"
version = "1.0.0"
description = "AI-powered video generation service using Google VEO 3.1 and Gemini"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.12.4",
    # Google Cloud and AI Platform
    "google-genai>=1.52.0",
    "google-cloud-aiplatform>=1.71.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-bigquery>=3.38.0",
    # Vertex AI
    "vertexai>=1.71.0",
    # HTTP and utilities
    "requests>=2.32.0",
    "httpx>=0.28.0",
    # Data processing
    "numpy>=2.0.0",
    "shapely>=2.0.0",
    "tqdm>=4.67.0",
    # Other utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["--verbose", "--cov=.", "--cov-report=term-missing"]
