  "scikit-learn==1.5.2",
  "scipy==1.13.1",
  "matplotlib==3.8.0",
  "google-cloud-storage>=2.18.0,<3",
  "google-auth>=2.35.0",
  "tqdm==4.66.4",
  "chromadb>=0.5.5,<0.6",
]


