[project]
name = "ac215-tarantino-big"
version = "1.0.0"
description = "End-to-end AI movie trailer generation application with adaptive quiz and modular pipeline"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Mathilde Cros"},
    {name = "Robert Debbas"},
    {name = "Maddy Jin"},
    {name = "Karlo Vrancic"},
]

dependencies = [
    # HTTP requests
    "requests>=2.32.5",
    # Google Cloud Storage
    "google-cloud-storage>=2.19.0",
    # Logging and utilities
    "python-dotenv>=1.0.0",
    # API Framework (needed by microservices)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    # OpenAI SDK (for OpenRouter compatibility)
    "openai>=1.50.0",
    # Utilities
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "watchdog",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
pythonpath = [
    "src",
]
testpaths = [
    "src",
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 50.0

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | node_modules
)/
'''

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = [
    "quiz_service",
    "movie_pipeline",
    "trailer_generator",
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py