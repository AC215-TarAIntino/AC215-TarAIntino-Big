[project]
name = "video-generator"
version = "1.0.0"
description = "AI-powered video generation service using Google VEO 3.1 and Gemini"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core API Framework
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "pydantic>=2.12.4",
    # Google Cloud and AI Platform
    "google-genai==1.52.0",
    "google-cloud-aiplatform==1.71.1",
    "google-cloud-storage==2.19.0",
    "google-cloud-bigquery==3.38.0",
    "google-cloud-core==2.5.0",
    "google-cloud-resource-manager==1.15.0",
    "google-api-core==2.28.1",
    "google-auth==2.43.0",
    "google-resumable-media==2.7.2",
    "googleapis-common-protos==1.72.0",
    "google-crc32c==1.7.1",
    "grpcio==1.76.0",
    "grpcio-status==1.71.2",
    "grpc-google-iam-v1==0.14.3",
    "proto-plus==1.26.1",
    "protobuf==5.29.5",
    # Vertex AI
    "vertexai==1.71.1",
    # HTTP and utilities
    "requests==2.32.5",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "h11==0.16.0",
    # Data processing
    "numpy==2.3.4",
    "shapely==2.1.2",
    "tqdm==4.67.1",
    # Other utilities
    "python-dateutil==2.9.0.post0",
    "python-dotenv>=1.0.0",
    "certifi==2025.10.5",
    "charset-normalizer==3.4.4",
    "idna==3.11",
    "urllib3==2.5.0",
    "cachetools==6.2.1",
    "packaging==25.0",
    "six==1.17.0",
    "pyasn1==0.6.1",
    "pyasn1-modules==0.4.2",
    "rsa==4.9.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "distro==1.9.0",
    "docstring-parser==0.17.0",
    "jiter==0.12.0",
    "sniffio==1.3.1",
    "anyio==4.11.0",
    "annotated-types==0.7.0",
    "pydantic-core==2.41.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["--verbose", "--cov=.", "--cov-report=term-missing"]
