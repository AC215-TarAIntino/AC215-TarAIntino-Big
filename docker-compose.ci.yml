services:
  chroma-init:
    restart: "no"
    entrypoint: /bin/true
    depends_on: {}

  quiz-rag-app:
    depends_on:
      chroma:
        condition: service_healthy

  quiz-service:
    depends_on:
      chroma:
        condition: service_healthy
      quiz-rag-app:
        condition: service_started
